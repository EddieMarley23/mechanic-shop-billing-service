apiVersion: v1
kind: ConfigMap
metadata:
  name: billing-service-config
  namespace: ${namespace}
data:
  SPRING_PROFILES_ACTIVE: "prod"
  APP_ENVIRONMENT: "production"
  SERVER_PORT: "8081"

  # Broker da Saga: Service `rabbitmq`, implantado pelo pipeline do OS Service.
  RABBITMQ_HOST: "rabbitmq"
  RABBITMQ_PORT: "5672"

  # Deve ser igual ao issuer dos tokens emitidos pelo OS Service e pela Lambda.
  JWT_ISSUER: "mechanic-shop-api"

  # Base dos links de aprovacao enviados por e-mail (URL publica do Kong).
  APP_BASE_URL: "${app_base_url}"
  PAYMENT_PROVIDER: "${payment_provider}"

  # Mailpit do cluster (implantado pelo pipeline do OS Service).
  SMTP_ACTIVE: "true"
  SMTP_HOST: "mailpit"
  SMTP_PORT: "1025"

  # ---------- Observabilidade ----------
  NEW_RELIC_APP_NAME: "${newrelic_app_name}"
  NEW_RELIC_LABELS: "env:production;service:billing-service"
  NEW_RELIC_DISTRIBUTED_TRACING_ENABLED: "true"
  NEW_RELIC_APPLICATION_LOGGING_ENABLED: "true"
  NEW_RELIC_APPLICATION_LOGGING_FORWARDING_ENABLED: "true"
  NEW_RELIC_APPLICATION_LOGGING_METRICS_ENABLED: "true"
  NEW_RELIC_LOG_FILE_NAME: "STDOUT"
